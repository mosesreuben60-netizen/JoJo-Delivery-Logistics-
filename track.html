<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track a delivery — JoJo Active Logistics</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="page">

  <nav class="nav">
    <a href="index.html" class="brand"><img src="assets/logo.png" alt="JoJo Active Logistics" class="brand-mark-img"></a>
    <div class="nav-links">
      <a href="book.html">Book a delivery</a>
    </div>
    <div style="display:flex; gap:8px;">
      
      <a href="book.html" class="btn btn-primary">Book now</a>
    </div>
  </nav>

  <main class="wrap" style="padding: 48px 24px 60px;">
    <div style="text-align:center; max-width:520px; margin:0 auto 36px;">
      <span class="eyebrow">Track a delivery</span>
      <h1 style="font-size:1.9rem; margin-top:8px;">Where's my package?</h1>
      <p class="lede" style="margin:0 auto;">Enter the tracking code from your booking confirmation.</p>
    </div>

    <form class="track-lookup" id="lookup-form">
      <input type="text" id="code-input" placeholder="RR-8K3PQ2" autocomplete="off">
      <button type="submit" class="btn btn-primary">Track</button>
    </form>

    <div id="result-area"></div>
  </main>

  <div class="footer">JoJo Active Logistics · <span id="footer-address"></span></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
  document.getElementById("footer-address").textContent = RUSHRIDA_CONFIG.SERVICE_ADDRESS;
  let map = null;
  let driverMarker = null;
  let customerMarker = null;
  let pollTimer = null;
  let currentCode = null;

  const resultArea = document.getElementById("result-area");
  const form = document.getElementById("lookup-form");
  const input = document.getElementById("code-input");

  // Pre-fill from ?code= param
  const params = new URLSearchParams(location.search);
  if (params.get("code")) {
    input.value = params.get("code");
    lookup(params.get("code"));
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    if (input.value.trim()) lookup(input.value.trim());
  });

  async function lookup(code) {
    resultArea.innerHTML = `<p style="text-align:center; color:var(--slate);">Looking up ${code}…</p>`;
    if (pollTimer) clearInterval(pollTimer);
    currentCode = code;
    try {
      const booking = await apiFetch(`/api/bookings/code/${encodeURIComponent(code)}`);
      render(booking);
      // Keep checking for updates while the delivery is actively moving
      if (["confirmed", "picked_up", "in_transit"].includes(booking.status)) {
        pollTimer = setInterval(async () => {
          try {
            const updated = await apiFetch(`/api/bookings/code/${encodeURIComponent(currentCode)}`);
            render(updated);
            if (!["confirmed", "picked_up", "in_transit"].includes(updated.status)) {
              clearInterval(pollTimer);
            }
          } catch {}
        }, 15000);
      }
    } catch {
      resultArea.innerHTML = `<p style="text-align:center; color:var(--red);">No booking found for that code. Double-check and try again.</p>`;
    }
  }

  function render(b) {
    const idx = statusIndex(b.status);
    const cancelled = b.status === "cancelled";

    let stepsHtml = "";
    if (cancelled) {
      stepsHtml = `<div class="tl-step done"><div class="tl-dot" style="background:var(--red); border-color:var(--red);"></div>
        <div><div class="tl-title">Booking cancelled</div><div class="tl-time">${formatDateTime(b.updatedAt)}</div></div></div>`;
    } else {
      stepsHtml = STATUS_FLOW.map((s, i) => `
        <div class="tl-step ${i < idx ? "done" : i === idx ? "current" : ""}">
          <div class="tl-dot"></div>
          <div>
            <div class="tl-title">${s.label}</div>
            <div class="tl-time">${i === idx ? formatDateTime(b.updatedAt) : i < idx ? "" : "Pending"}</div>
          </div>
        </div>
      `).join("");
    }

    const hasLiveLocation = b.driverLocation && b.driverLocation.lat != null && !cancelled;

    resultArea.innerHTML = `
      <div class="waybill" style="max-width:520px; margin:0 auto 32px;">
        <div class="waybill-row"><span class="waybill-label">Tracking</span><span class="waybill-value">${b.trackingCode}</span></div>
        <div class="waybill-row"><span class="waybill-label">Route</span><span class="waybill-value">${b.pickupAddress} → ${b.dropoffAddress}</span></div>
        <div class="waybill-row"><span class="waybill-label">Service</span><span class="waybill-value">${b.tierLabel}</span></div>
        <div class="waybill-row"><span class="waybill-label">Payment</span><span class="waybill-value">${b.paymentStatus === "paid" ? "Paid" : "Unpaid"} · ${formatNaira(b.price)}</span></div>
      </div>
      ${hasLiveLocation ? '<div class="map-container" id="live-map"></div>' : ""}
      ${hasLiveLocation ? '<div style="text-align:center; margin:-16px auto 24px;"><button id="show-my-location-btn" class="btn btn-ghost" style="font-size:0.82rem; padding:8px 14px;">📍 Show my location on the map</button><p id="distance-note" style="color:var(--slate); font-size:0.8rem; margin-top:8px;"></p></div>' : ""}
      <div class="timeline">${stepsHtml}</div>
    `;

    if (hasLiveLocation) {
      initOrUpdateMap(b.driverLocation.lat, b.driverLocation.lng);
      document.getElementById("show-my-location-btn").addEventListener("click", () => showMyLocation(b.driverLocation));
    } else if (map) {
      map.remove();
      map = null;
    }
  }

  function initOrUpdateMap(lat, lng) {
    if (!map) {
      map = L.map("live-map").setView([lat, lng], 14);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 18
      }).addTo(map);
      driverMarker = L.marker([lat, lng]).addTo(map).bindPopup("Rider's current location");
    } else {
      driverMarker.setLatLng([lat, lng]);
      map.panTo([lat, lng]);
    }
  }

  // Opt-in only — the browser's location prompt only appears after the
  // customer taps the button, never automatically on page load.
  function showMyLocation(driverLocation) {
    const btn = document.getElementById("show-my-location-btn");
    const note = document.getElementById("distance-note");
    if (!navigator.geolocation) {
      note.textContent = "Your browser doesn't support location access.";
      return;
    }
    btn.textContent = "📍 Finding you…";
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const { latitude, longitude } = position.coords;
        if (!customerMarker) {
          customerMarker = L.circleMarker([latitude, longitude], {
            radius: 9, color: "#FFC400", fillColor: "#FFC400", fillOpacity: 0.9, weight: 2
          }).addTo(map).bindPopup("You are here");
        } else {
          customerMarker.setLatLng([latitude, longitude]);
        }
        const bounds = L.latLngBounds([[latitude, longitude], [driverLocation.lat, driverLocation.lng]]);
        map.fitBounds(bounds, { padding: [30, 30] });

        const distanceKm = haversineKm(latitude, longitude, driverLocation.lat, driverLocation.lng);
        note.textContent = `Your rider is approximately ${(Math.round(distanceKm * 10) / 10)} km from you.`;
        btn.textContent = "📍 Refresh my location";
      },
      () => {
        note.textContent = "Location access was denied — can't show your position.";
        btn.textContent = "📍 Show my location on the map";
      },
      { enableHighAccuracy: true, timeout: 15000 }
    );
  }
  initFaqWidget();

</script>
</body>
</html>
